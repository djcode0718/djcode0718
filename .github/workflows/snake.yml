name: Generate Contribution Snake

on:
  schedule:
    # Refresh the contribution animation twice a day.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate snake animation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Generate light-mode snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%23216e39

      - name: Generate dark-mode snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Publish generated SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: "Update contribution snake"
